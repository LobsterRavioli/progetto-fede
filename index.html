<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff8fb1">
<title>Scusa Lisa 🌸</title>
<meta name="description" content="Scusa Lisa, facciamo pace!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="background-music" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>
<button id="music-toggle-btn" title="Play/Pausa musica" aria-label="Play/Pausa musica">🔇</button>

<div class="sky" aria-hidden="true">
  <span class="cloud cloud-1">☁️</span>
  <span class="cloud cloud-2">☁️</span>
  <span class="cloud cloud-3">☁️</span>
</div>

<div id="petal-layer" aria-hidden="true"></div>

<main class="stage">

  <section class="cover" id="cover-section">
    <div class="gif-frame gif-frame-cover">
      <iframe src="https://giphy.com/embed/04DMYESomjb6BCBNB8" width="100%" height="100%" style="position:absolute;top:0;left:0" frameborder="0" class="giphy-embed" allowFullScreen title="Cane che balla"></iframe>
    </div>
    <h1 class="cover-title">Ho una cosa da dirti, Lisa</h1>
    <p class="cover-subtitle">Apri piano...</p>
    <button id="open-btn" class="btn btn-open">Apri 💌</button>
  </section>

  <section class="intro" id="intro-section" aria-hidden="true">
    <div class="badge">con affetto, per Lisa</div>
    <h1 class="title">Ops... ho combinato un pasticcio 🌷</h1>
    <p class="subtitle">Ho preparato due bottoni. Uno dei due è un po' timido...</p>

    <div class="choice-box">
      <button id="yes-btn" class="btn btn-yes">Sì, facciamo pace 🌸</button>
      <button id="no-btn" class="btn btn-no">No</button>
    </div>

    <p class="hint" id="hint-text">psst, prova a cliccare "No" 👀</p>

    <div class="gif-frame gif-frame-small">
      <iframe src="https://giphy.com/embed/pY8jLmZw0ElqvVeRH4" width="100%" height="100%" style="position:absolute;top:0;left:0" frameborder="0" class="giphy-embed" allowFullScreen title="Gatto che ci pensa su"></iframe>
    </div>
  </section>

  <section class="reveal" id="reveal-section" aria-hidden="true">
    <div class="flower-burst" id="flower-burst" aria-hidden="true"></div>
    <h2 class="apology-text" id="apology-text">Scusa Lisa,<br>Perdonami <span class="sad">:(</span><br>facciamo pace!</h2>
    <div class="flower-row" aria-hidden="true">
      <span>🌸</span><span>🌷</span><span>🌼</span><span>🌻</span><span>🌺</span><span>🌷</span><span>🌸</span>
    </div>
    <div class="gif-frame gif-frame-small">
      <iframe src="https://giphy.com/embed/uyfgCPQeCjYMVxt2m3" width="100%" height="100%" style="position:absolute;top:0;left:0" frameborder="0" class="giphy-embed" allowFullScreen title="Gattino felice"></iframe>
    </div>
    <button id="replay-btn" class="btn btn-replay">Ancora fiori, per favore 🌼</button>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
